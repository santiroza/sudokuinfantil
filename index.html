        /* Rejillas personalizadas */
        .sudoku-grid {
            display: grid;

            background-color: #334155;
            padding: 4px;
            border-radius: 1.25rem;
            box-sizing: border-box;
        }

        .grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .grid-6x6 {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        /* MARCADO Y SEPARACIÓN CLARA DE CUADRANTES / BLOQUES */
        /* Borde grueso vertical entre cuadrantes en 4x4 */
        .grid-4x4 .cell-wrapper:nth-child(2n) {
            border-right: 5px solid #0f172a;
        }
        .grid-4x4 .cell-wrapper:nth-child(4n) {
            border-right: none;
        }

        /* Borde grueso horizontal entre cuadrantes en 4x4 */
        .grid-4x4 .cell-wrapper:nth-child(n+5):nth-child(-n+8) {
            border-bottom: 5px solid #0f172a;
        }

        /* Separadores de bloques en 6x6 (bloques de 2x3) */
        .grid-6x6 .cell-wrapper:nth-child(3n) {
            border-right: 5px solid #0f172a;
        }
        .grid-6x6 .cell-wrapper:nth-child(6n) {
            border-right: none;
        }
        .grid-6x6 .cell-wrapper:nth-child(n+13):nth-child(-n+18),
        .grid-6x6 .cell-wrapper:nth-child(n+25):nth-child(-n+30) {
            border-bottom: 5px solid #0f172a;
        }

        /* Alternancia clara de color de fondo para diferenciar los cuadrantes */
        .block-even {
            background-color: #f8fafc;
            padding: 2px;
        }
        .block-odd {
            background-color: #cbd5e1;
            padding: 2px;
        }

        /* Animaciones */
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.2s ease-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {

        /* --- ESTADO DE JUEGO --- */

        let userProgress = JSON.parse(localStorage.getItem('sudoku_kids_prog_v2')) || {

        /* --- EFECTOS DE SONIDO (Web Audio API) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(850, now + 0.06);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'place') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'erase') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.09);
                        noteGain.gain.setValueAtTime(0.25, now + idx * 0.09);
                        noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.09 + 0.18);
                        
                        noteOsc.start(now + idx * 0.09);
                        noteOsc.stop(now + idx * 0.09 + 0.18);
                    });
                }
            } catch (e) {
                console.log("Audio no soportado o silenciado");
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (icon) {
                icon.className = soundEnabled ? 'fas fa-volume-up text-lg' : 'fas fa-volume-mute text-lg';
            }
        }

        /* --- CONTROL DE PANTALLA COMPLETA CON FALLBACK PARA IFRAMES --- */
        async function toggleFullscreen() {
            playSound('select');
            const targetEl = document.getElementById('gameView').classList.contains('hidden') 
                ? document.getElementById('levelSelectView') 
                : document.getElementById('gameView');
            
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFullscreen && !isFallbackFullscreen) {
                try {
                    // Intentar API Nativa de Pantalla Completa
                    if (targetEl.requestFullscreen) {
                        await targetEl.requestFullscreen();
                    } else if (targetEl.webkitRequestFullscreen) {
                        await targetEl.webkitRequestFullscreen();
                    } else if (targetEl.msRequestFullscreen) {
                        await targetEl.msRequestFullscreen();
                    }
                } catch (err) {
                    // Si el iframe prohíbe el Fullscreen por Permissions Policy, usar CSS Fallback
                    console.warn("Fullscreen nativo bloqueado por política de permisos del iframe. Activando modo maximizado.");
                    targetEl.classList.add('fallback-fullscreen');
                    isFallbackFullscreen = true;
                    updateFullscreenIcon();
                }
            } else {
                if (isFallbackFullscreen) {
                    targetEl.classList.remove('fallback-fullscreen');
                    isFallbackFullscreen = false;
                    updateFullscreenIcon();
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
        }

        // Detectar si el usuario sale de pantalla completa con la tecla ESC o botón nativo
        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
        document.addEventListener('msfullscreenchange', updateFullscreenIcon);

        function updateFullscreenIcon() {
            const icon = document.getElementById('fullscreenIcon');
            if (!icon) return;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || isFallbackFullscreen;
            if (isFullscreen) {
                icon.className = 'fas fa-compress text-lg';
            } else {
                icon.className = 'fas fa-expand text-lg';
            }
        }

        /* --- INICIALIZACIÓN INMEDIATA DEL DOM --- */
        document.addEventListener('DOMContentLoaded', () => {
            renderThemeSelector();
            renderLevelGrid();
            startLevel(0);

            // Escuchador de teclado físico
            document.addEventListener('keydown', (e) => {
                if (document.getElementById('gameView').classList.contains('hidden')) return;
                if (!selectedCell) return;

                const key = parseInt(e.key);
                const maxVal = LEVELS[currentLevelIndex].size;
                if (key >= 1 && key <= maxVal) {
                    inputSymbol(key);
                } else if (e.key === 'Backspace' || e.key === 'Delete') {
                    eraseCell();
                }
            });
        });

        function renderThemeSelector() {
            const container = document.getElementById('themeSelector');
            container.innerHTML = '';
            
            Object.values(THEMES).forEach(theme => {
                const btn = document.createElement('button');
                const isSelected = theme.id === currentTheme;
                btn.className = `p-2.5 rounded-2xl font-bold border-2 transition text-xs sm:text-sm flex items-center justify-center gap-1.5 ${
                    isSelected 
                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' 
                    : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                }`;
                btn.innerHTML = `${theme.name}`;
                btn.onclick = () => {
                    playSound('select');
                    currentTheme = theme.id;
                    renderThemeSelector();
                    if (LEVELS[currentLevelIndex]) {
                        renderSudokuBoard(LEVELS[currentLevelIndex].size);
                        renderKeypad(LEVELS[currentLevelIndex].size);
                    }
                };
                container.appendChild(btn);
            });
        }

        function renderLevelGrid() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';

            LEVELS.forEach((lvl, idx) => {
                const isUnlocked = lvl.level <= userProgress.unlockedLevel;
                const starsCount = userProgress.stars[lvl.level] || 0;

                const btn = document.createElement('button');
                btn.disabled = !isUnlocked;
                btn.className = `aspect-square rounded-3xl font-extrabold flex flex-col items-center justify-center border-4 transition-all relative ${
                    isUnlocked 
                    ? 'bg-white hover:bg-indigo-50 border-indigo-400 text-indigo-900 shadow-fun hover:scale-105 cursor-pointer' 
                    : 'bg-slate-200 border-slate-300 text-slate-400 cursor-not-allowed opacity-70'
                }`;

                let starsHtml = '';
                if (isUnlocked && starsCount > 0) {
                    starsHtml = '<div class="flex text-[10px] text-amber-400 mt-0.5 gap-0.5">';
                    for (let i = 0; i < 3; i++) {
                        starsHtml += `<i class="${i < starsCount ? 'fas' : 'far'} fa-star"></i>`;
                    }
                    starsHtml += '</div>';
                }

                btn.innerHTML = `
                    ${isUnlocked ? `<span class="text-xl sm:text-2xl">${lvl.level}</span>` : '<i class="fas fa-lock text-lg"></i>'}
                    <span class="text-[9px] text-slate-500 font-semibold">${lvl.size}x${lvl.size}</span>
                    ${starsHtml}
                `;

                btn.onclick = () => startLevel(idx);
                grid.appendChild(btn);
            });
        }

        function showLevelSelect() {
            playSound('select');
            clearInterval(timerInterval);
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('levelSelectView').classList.remove('hidden');
            document.getElementById('victoryModal').classList.add('hidden');
            renderLevelGrid();
        }

        /* --- MECÁNICAS DEL JUEGO --- */
        function startLevel(index) {
            playSound('select');
            currentLevelIndex = index;
            const levelData = LEVELS[index];

            document.getElementById('levelSelectView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('victoryModal').classList.add('hidden');

            document.getElementById('levelBadge').innerText = `Nivel ${levelData.level}`;
            document.getElementById('diffBadge').innerText = levelData.level <= 5 ? 'Fácil 4x4' : (levelData.level <= 10 ? 'Medio' : 'Desafío 6x6');

            boardState = levelData.grid.map(row => [...row]);
            selectedCell = null;
            secondsElapsed = 0;

            startTimer();
            renderSudokuBoard(levelData.size);
            renderKeypad(levelData.size);
        }

        function startTimer() {
            clearInterval(timerInterval);
            document.getElementById('timerText').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerText').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function getSymbolDisplay(val) {
            if (!val || val === 0) return '';
            const theme = THEMES[currentTheme];
            return theme.items[val - 1] || val;
        }

        function renderSudokuBoard(size) {
            const container = document.getElementById('sudokuContainer');
            container.innerHTML = '';

            const gridDiv = document.createElement('div');
            gridDiv.className = `sudoku-grid grid-${size}x${size}`;

            const initialGrid = LEVELS[currentLevelIndex].grid;
            const boxRows = 2;
            const boxCols = size === 4 ? 2 : 3;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const wrapper = document.createElement('div');
                    
                    // Determinar el bloque actual para alternar el fondo del cuadrante
                    const blockRow = Math.floor(r / boxRows);
                    const blockCol = Math.floor(c / boxCols);
                    const isEvenBlock = (blockRow + blockCol) % 2 === 0;

                    wrapper.className = `cell-wrapper w-full h-full ${isEvenBlock ? 'block-even' : 'block-odd'}`;

                    const val = boardState[r][c];
                    const isFixed = initialGrid[r][c] !== 0;

                    const cellBtn = document.createElement('button');
                    cellBtn.className = `w-full h-full rounded-xl font-bold flex items-center justify-center transition-all duration-150 ${
                        isFixed 
                        ? 'bg-slate-200 text-slate-800 cursor-not-allowed border-2 border-slate-300' 
                        : 'bg-white text-indigo-600 hover:bg-indigo-50 border-2 border-slate-100 shadow-sm'
                    }`;

                    if (size === 4) {
                        cellBtn.classList.add('text-2xl', 'sm:text-3xl');
                    } else {
                        cellBtn.classList.add('text-xl', 'sm:text-2xl');
                    }

                    cellBtn.innerHTML = getSymbolDisplay(val);
                    cellBtn.dataset.row = r;
                    cellBtn.dataset.col = c;

                    cellBtn.onclick = () => selectCell(r, c);
                    wrapper.appendChild(cellBtn);
                    gridDiv.appendChild(wrapper);
                }
            }
            container.appendChild(gridDiv);
            highlightBoard();
        }

        function renderKeypad(size) {
            const keypad = document.getElementById('inputKeypad');
            keypad.innerHTML = '';

            for (let i = 1; i <= size; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-bounce flex-1 aspect-square bg-white hover:bg-indigo-50 text-slate-800 font-extrabold rounded-2xl shadow-fun border-2 border-indigo-200 text-xl sm:text-2xl flex items-center justify-center transition';
                btn.innerHTML = getSymbolDisplay(i);
                btn.onclick = () => inputSymbol(i);
                keypad.appendChild(btn);
            }
        }

        function selectCell(row, col) {
            playSound('select');
            selectedCell = { row, col };
            highlightBoard();
        }

        function highlightBoard() {
            const buttons = document.querySelectorAll('.cell-wrapper button');

            buttons.forEach(btn => {
                const r = parseInt(btn.dataset.row);
                const c = parseInt(btn.dataset.col);
                const isFixed = LEVELS[currentLevelIndex].grid[r][c] !== 0;

                btn.classList.remove('bg-amber-200', 'bg-indigo-50', 'ring-2', 'ring-indigo-400');

                if (!isFixed) {
                    btn.className = btn.className.replace(/bg-\w+-\d+/, 'bg-white');
                }

                if (selectedCell) {
                    if (r === selectedCell.row && c === selectedCell.col) {
                        btn.classList.add('bg-amber-200', 'ring-2', 'ring-indigo-400');
                    }
                    else if (r === selectedCell.row || c === selectedCell.col) {
                        if (!isFixed) btn.classList.add('bg-indigo-50');
                    }
                }
            });
        }

        function inputSymbol(val) {
            if (!selectedCell) return;
            const { row, col } = selectedCell;

            if (LEVELS[currentLevelIndex].grid[row][col] !== 0) return;

            playSound('place');
            boardState[row][col] = val;

            const btn = document.querySelector(`button[data-row="${row}"][data-col="${col}"]`);
            if (btn) {
                btn.innerHTML = getSymbolDisplay(val);
                btn.classList.add('animate-pop');
                setTimeout(() => btn.classList.remove('animate-pop'), 200);
            }

            highlightBoard();
        }

        function eraseCell() {
            if (!selectedCell) return;
            const { row, col } = selectedCell;

            if (LEVELS[currentLevelIndex].grid[row][col] !== 0) return;

            playSound('erase');
            boardState[row][col] = 0;

            const btn = document.querySelector(`button[data-row="${row}"][data-col="${col}"]`);
            if (btn) {
                btn.innerHTML = '';
            }
            highlightBoard();
        }

        function getHint() {
            playSound('select');
            const solution = LEVELS[currentLevelIndex].solution;

            let targetRow = -1, targetCol = -1;

            if (selectedCell && boardState[selectedCell.row][selectedCell.col] === 0) {
                targetRow = selectedCell.row;
                targetCol = selectedCell.col;
            } else {
                const emptyCells = [];
                const size = LEVELS[currentLevelIndex].size;
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (boardState[r][c] === 0) emptyCells.push({ r, c });
                    }
                }
                if (emptyCells.length > 0) {
                    const pick = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    targetRow = pick.r;
                    targetCol = pick.c;
                }
            }

            if (targetRow !== -1 && targetCol !== -1) {
                const correctVal = solution[targetRow][targetCol];
                boardState[targetRow][targetCol] = correctVal;

                const btn = document.querySelector(`button[data-row="${targetRow}"][data-col="${targetCol}"]`);
                if (btn) {
                    btn.innerHTML = getSymbolDisplay(correctVal);
                    btn.classList.add('bg-emerald-200', 'animate-pop');
                    setTimeout(() => btn.classList.remove('bg-emerald-200', 'animate-pop'), 800);
                }
            }
        }

        /* --- VALIDACIÓN DE MÚLTIPLES SOLUCIONES VÁLIDAS POR REGLAS --- */
        function checkSolution() {
            const size = LEVELS[currentLevelIndex].size;
            let isComplete = true;
            let hasErrors = false;

            document.querySelectorAll('.cell-wrapper button').forEach(btn => {
                btn.classList.remove('animate-shake', 'bg-rose-200');
            });

            const boxRows = 2;
            const boxCols = size === 4 ? 2 : 3;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const val = boardState[r][c];

                    if (val === 0) {
                        isComplete = false;
                        continue;
                    }

                    let isValidCell = true;

                    // 1. Validar Fila
                    for (let c2 = 0; c2 < size; c2++) {
                        if (c2 !== c && boardState[r][c2] === val) {
                            isValidCell = false;
                            break;
                        }
                    }

                    // 2. Validar Columna
                    if (isValidCell) {
                        for (let r2 = 0; r2 < size; r2++) {
                            if (r2 !== r && boardState[r2][c] === val) {
                                isValidCell = false;
                                break;
                            }
                        }
                    }

                    // 3. Validar Bloque
                    if (isValidCell) {
                        const startRow = Math.floor(r / boxRows) * boxRows;
                        const startCol = Math.floor(c / boxCols) * boxCols;
                        for (let br = startRow; br < startRow + boxRows; br++) {
                            for (let bc = startCol; bc < startCol + boxCols; bc++) {
                                if ((br !== r || bc !== c) && boardState[br][bc] === val) {
                                    isValidCell = false;
                                    break;
                                }
                            }
                            if (!isValidCell) break;
                        }
                    }

                    if (!isValidCell) {
                        hasErrors = true;
                        const btn = document.querySelector(`button[data-row="${r}"][data-col="${c}"]`);
                        if (btn) {
                            btn.classList.add('animate-shake', 'bg-rose-200');
                            setTimeout(() => btn.classList.remove('animate-shake', 'bg-rose-200'), 500);
                        }
                    }
                }
            }

            if (hasErrors || !isComplete) {
                playSound('error');
            } else {
                handleWin();
            }
        }

        function handleWin() {
            clearInterval(timerInterval);
            playSound('win');

            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            const currentLvlNum = LEVELS[currentLevelIndex].level;
            if (currentLvlNum >= userProgress.unlockedLevel && currentLvlNum < 15) {
                userProgress.unlockedLevel = currentLvlNum + 1;
            }

            let stars = 3;
            if (secondsElapsed > 120) stars = 2;
            if (secondsElapsed > 240) stars = 1;
            userProgress.stars[currentLvlNum] = Math.max(userProgress.stars[currentLvlNum] || 0, stars);

            localStorage.setItem('sudoku_kids_prog_v2', JSON.stringify(userProgress));

            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('modalTime').innerText = `${mins}:${secs}`;

            const modalStars = document.getElementById('modalStars');
            modalStars.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                modalStars.innerHTML += `<i class="${i < stars ? 'fas' : 'far'} fa-star"></i>`;
            }

            const btnNext = document.getElementById('btnNextLevel');
            btnNext.style.display = currentLevelIndex < LEVELS.length - 1 ? 'flex' : 'none';

            document.getElementById('victoryModal').classList.remove('hidden');
        }

        function nextLevel() {
            document.getElementById('victoryModal').classList.add('hidden');
            if (currentLevelIndex < LEVELS.length - 1) {
                startLevel(currentLevelIndex + 1);
            } else {
                showLevelSelect();
            }
        }
    </script>
